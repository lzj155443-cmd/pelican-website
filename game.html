<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>骑行小游戏</title><link rel="stylesheet" href="style.css"></head><body><nav><div class="logo"><b>🦤</b> 鹈鹕奇妙骑行</div><div class="links"><a href="index.html">首页</a><a href="map.html">骑行地图</a><a href="game.html">小游戏</a><a href="pokedex.html">鹈鹕图鉴</a></div></nav><main class="page"><div class="title"><small>MINI GAME</small><h1>森林寻宝</h1><p class="lead" style="margin:auto">点击金币，让鹈鹕收集沿途的宝藏！</p></div><div class="game" id="game"><div class="score">SCORE：<span id="score">0</span></div><div class="player" id="player">🦤🚲</div><div class="groad"></div></div><div style="text-align:center"><button class="btn" onclick="startGame()">重新开始</button> <a class="btn" href="pokedex.html">查看图鉴 →</a></div></main><script>
let score=0,timer;
const box=document.getElementById('game'),player=document.getElementById('player'),scoreEl=document.getElementById('score');
function startGame(){score=0;scoreEl.textContent=score;document.querySelectorAll('.coin').forEach(e=>e.remove());clearInterval(timer);spawn();timer=setInterval(spawn,900)}
function spawn(){const c=document.createElement('div');c.className='coin';c.textContent='🪙';c.style.left=(220+Math.random()*620)+'px';c.style.top=(70+Math.random()*250)+'px';c.onclick=()=>{score+=10;scoreEl.textContent=score;c.remove()};box.appendChild(c);setTimeout(()=>c.remove(),2800)}
box.addEventListener('mousemove',e=>{const r=box.getBoundingClientRect();let y=e.clientY-r.top-45;y=Math.max(80,Math.min(330,y));player.style.bottom=(500-y)+'px'});startGame();
</script></body></html>
